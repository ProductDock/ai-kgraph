# Gate 2 → Stage 3 handoff: when an approved spec.md lands on main, summon an engineer.
#
# This workflow deliberately does NOT write plan.md. plan.md is the artifact of an
# interactive plan-mode session where the engineer interrogates the plan about breaking
# changes and risk (playbook lesson 4) — that argument is the value, and a plan nobody
# questioned is not an approval record. So we automate the summons, not the plan.
#
# Specs get approved more than once: an engineer who finds the spec incomplete during
# planning sends it back to the product owner, and the amended spec merges through the
# same gate. So this fires on modified specs too. First approval opens the plan task;
# every later one comments on that task (reopening it if it had been closed) rather than
# opening a duplicate.
#
# See docs/plan-handoff.md.

name: plan-ready

on:
  push:
    branches: [main]
    paths:
      - 'intent/**/spec.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'intent slug to raise or refresh a plan task for'
        required: true

permissions:
  contents: read
  issues: write

jobs:
  summon-engineer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find approved specs
        id: find
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.slug }}" ]; then
            printf 'intent/%s/spec.md\n' "${{ inputs.slug }}" > specs.txt
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            # github.event.before is all-zeros on a branch's first push and stale after a
            # force-push; fall back to the pushed commit's parent so the job never dies on
            # an unresolvable base.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet "${{ github.sha }}^" || true)"
            fi
            if [ -n "$base" ]; then
              # AM, not A: an amended spec re-approved after planning is a modification.
              git diff --name-only --diff-filter=AM \
                "$base" "${{ github.sha }}" -- 'intent/**/spec.md' > specs.txt
            else
              git ls-tree -r --name-only "${{ github.sha }}" -- intent \
                | grep '/spec\.md$' > specs.txt || true
            fi
            echo "base=$base" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$(grep -c . specs.txt || true)" >> "$GITHUB_OUTPUT"
          cat specs.txt

      - name: Raise or refresh the plan task
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional repo variable: GitHub handle to assign, e.g. a tech lead who
          # distributes the work. Left unassigned if unset.
          ASSIGNEE: ${{ vars.PLAN_ASSIGNEE }}
          BASE: ${{ steps.find.outputs.base }}
        run: |
          set -euo pipefail
          : > notify.txt

          while read -r spec; do
            [ -n "$spec" ] || continue
            dir="$(dirname "$spec")"
            slug="$(basename "$dir")"
            title="$(sed -n 's/^# Intent: //p' "$dir/intent.md" 2>/dev/null | head -1)"
            title="${title:-$slug}"

            concerns="$(sed -n '/^## Areas of concern/,$p' "$spec" \
              | grep -viE '^(## Areas of concern|None\.?|\s*)$' || true)"

            # Does a plan task already exist for this spec? Search the body for the spec
            # path first (how every issue this workflow opens names it), then fall back to
            # a title match, since code search can lag behind a fresh issue by a minute.
            issue="$(gh issue list --state all --label plan --limit 1 \
              --search "\"$spec\" in:body" --json number --jq '.[0].number // empty' \
              2>/dev/null || true)"
            if [ -z "$issue" ]; then
              issue="$(gh issue list --state all --label plan --limit 200 \
                --json number,title \
                --jq "[.[] | select(.title == \"plan: $title\")] | .[0].number // empty" \
                2>/dev/null || true)"
            fi

            if [ -n "$issue" ]; then
              # Re-approval: the spec changed after the plan task was already raised.
              stat=""
              if [ -n "${BASE:-}" ]; then
                stat="$(git diff --stat "$BASE" "${{ github.sha }}" -- "$spec" || true)"
              fi

              cat > comment.md <<COMMENT
          **Spec updated and re-approved on \`main\`.** Re-read it before planning further — the version you planned against is no longer the approved one.

          | | |
          |---|---|
          | Spec | \`$spec\` |
          | Approved by | @${{ github.actor }} |
          | Commit | ${{ github.sha }} |

          \`\`\`
          ${stat:-(diff stat unavailable)}
          \`\`\`

          <details><summary>What changed</summary>

          \`\`\`diff
          COMMENT

              # Appended, never interpolated into the heredoc: spec diffs contain backticks
              # and $(...) that an unquoted heredoc would execute.
              if [ -n "${BASE:-}" ]; then
                git diff "$BASE" "${{ github.sha }}" -- "$spec" | head -200 >> comment.md || true
              else
                echo "(unavailable — run: git log -p -- $spec)" >> comment.md
              fi

              cat >> comment.md <<COMMENT
          \`\`\`

          </details>

          If \`$dir/plan.md\` is already committed, update it in the same PR as the implementation and say why it moved — a stale plan reads as the approved intent at later review stages.
          COMMENT

              if [ -n "$concerns" ]; then
                {
                  echo
                  echo "## ⚠ Concerns still flagged in the spec"
                  echo
                  printf '%s\n' "$concerns"
                } >> comment.md
              fi

              gh issue comment "$issue" --body-file comment.md >/dev/null
              # The amended spec has landed, so whatever the plan was blocked on is
              # resolved as far as this gate can tell. Adding/removing labels is best
              # effort: a missing label must not fail the handoff.
              gh issue edit "$issue" --add-label spec-revised >/dev/null 2>&1 || true
              gh issue edit "$issue" --remove-label blocked-on-spec >/dev/null 2>&1 || true
              state="$(gh issue view "$issue" --json state --jq .state)"
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$issue" \
                  --comment "Reopened: the spec was amended and re-approved after this task was closed." >/dev/null
              fi
              url="$(gh issue view "$issue" --json url --jq .url)"
              echo "::notice::spec re-approved for $slug → $url"
              printf 'Spec updated and re-approved: %s\n' "$url" >> notify.txt
              continue
            fi

            cat > body.md <<BODY
          **Spec approved — ready to plan.** Stage 3 of the [AI-Native SDLC](https://academy.claude.com/courses/ai-native-sdlc-playbook/plan-mode).

          | | |
          |---|---|
          | Intent | \`$dir/intent.md\` |
          | Spec | \`$spec\` |
          | Approved by | @${{ github.actor }} |
          | Commit | ${{ github.sha }} |

          ## How to start

          Open Claude Code in this repo and run the \`plan-from-spec\` skill:

          \`\`\`
          /plan-from-spec $slug
          \`\`\`

          Or by hand — **start in plan mode** (read-only), then:

          \`\`\`
          Read $dir/intent.md and $spec. Produce an implementation plan covering the
          files you will change, the sequence of work, the risks, and what will count
          as proof it works.
          \`\`\`

          ## Before you accept the plan

          Lesson 4 says the plan is not done until it is interrogated. Ask it, out loud:

          - [ ] What existing behaviour does this break? What depends on the code being changed?
          - [ ] Which step here is the riskiest, and what happens if it is wrong?
          - [ ] What is the rollback if this ships and misbehaves?
          - [ ] Does the plan close every open question the intent left?
          - [ ] What will count as proof — which command, which assertion, which screenshot?
          - [ ] Iterate until another engineer could implement it without asking you anything.

          Then commit it as \`$dir/plan.md\` **before** accepting the plan and building.
          If the implementation later deviates from the plan, update \`plan.md\`.

          ## If the spec turns out to be wrong

          Do not plan around a gap. Instead:

          1. Comment here with what the spec is missing or what it would break.
          2. Add the **\`blocked-on-spec\`** label to this issue, and link the amendment PR.
          3. Amend \`$spec\` (or \`$dir/intent.md\` if the gap is in what was *wanted*) and
             open a PR for the product owner. Merging it is gate 2 again.

          The re-approval lands back on this issue as a comment and clears the label. The
          block belongs in this trail, not silently patched over in \`plan.md\`.
          BODY

            if [ -n "$concerns" ]; then
              {
                echo
                echo "## ⚠ Concerns flagged during design"
                echo
                echo "Raised in the spec and carried over — resolve with the policy owner"
                echo "before or during planning, not after implementation:"
                echo
                printf '%s\n' "$concerns"
              } >> body.md
            fi

            args=(--title "plan: $title" --body-file body.md --label plan --label ready-to-plan)
            # Note: plain `[ ... ] && args+=(...)` would abort the job under `set -e`
            # whenever the test is false.
            if [ -n "${ASSIGNEE:-}" ]; then args+=(--assignee "$ASSIGNEE"); fi
            if [ -n "$concerns" ]; then args+=(--label needs-policy-owner); fi
            url="$(gh issue create "${args[@]}")"
            echo "::notice::plan task for $slug → $url"
            printf 'Spec approved, ready to plan: %s\n' "$url" >> notify.txt
          done < specs.txt

      - name: Notify the team channel
        if: steps.find.outputs.count != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -s notify.txt ] || exit 0
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          while read -r line; do
            [ -n "$line" ] || continue
            payload="$(jq -nc --arg t "$line" '{text:$t}')"
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
          done < notify.txt
