# Stage 2 of the AI-Native SDLC: generate spec.md when an intent.md is approved.
#
# The approval gate is the merge itself: an intent.md only reaches the default branch
# once the product owner has approved it, so a push here means "approved".
#
# Output is a pull request, never a direct commit — agent output goes through branch
# protection (playbook lesson 12). The product owner reviewing that PR is the
# Stage 2 review step (lesson 3).
#
# One intent = one spec = one PR. A push that merges several intents fans out into
# one matrix job per intent, so every spec gets its own review thread and its own
# 'Areas of concern' triage. Batching them into a single PR loses review signal.
#
# The spec PR is announced to Slack if SLACK_WEBHOOK_URL is set, because it waits on one
# named person and nothing else in the pipeline tells them it exists.
#
# See docs/spec-from-intent-automation.md for the design and the manual fallback.

name: spec-from-intent

on:
  push:
    branches: [main]
    paths:
      - 'intent/**/intent.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'intent slug to generate a spec for, e.g. 2026-09-25-claims-status-visibility (skipped if spec.md already exists — amend it by hand instead)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find approved intents needing a spec
        id: find
        env:
          # Bound through the environment, not interpolated into the script: a slug is
          # attacker-controllable via workflow_dispatch.
          SLUG: ${{ inputs.slug }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SLUG" ]; then
            printf 'intent/%s/intent.md\n' "$SLUG" > changed.txt
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Force-push or an unreachable base: we cannot say what this push changed,
            # so fall back to every spec-less intent on the branch rather than failing.
            echo "::warning::$BEFORE is unreachable — scanning all intents instead"
            git ls-files 'intent/*/intent.md' > changed.txt
          else
            git diff --name-only --diff-filter=AM \
              "$BEFORE" "$AFTER" -- 'intent/**/intent.md' > changed.txt
          fi
          # Merging to main IS the product owner's approval (branch protection enforces
          # the gate), so the only Status worth blocking on is a literal 'draft' pushed
          # straight to main by accident. 'awaiting product owner review' is what the
          # write-intent skill sets on the PR; by the time we see it here, it is approved.
          : > todo.txt
          while read -r f; do
            [ -f "$f" ] || continue
            if grep -qiE '^\s*-?\s*\*\*Status:\*\*\s*draft\s*$' "$f"; then
              echo "::notice::$f is still marked draft — skipping"
              continue
            fi
            if [ -f "$(dirname "$f")/spec.md" ]; then
              echo "::notice::$(dirname "$f")/spec.md already exists — skipping"
              continue
            fi
            echo "$f" >> todo.txt
          done < changed.txt
          cat todo.txt
          slugs="$(cut -d/ -f2 todo.txt | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$slugs")" >> "$GITHUB_OUTPUT"

  spec:
    needs: find
    if: needs.find.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One intent failing must not deny the others their spec.
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.find.outputs.slugs) }}
    concurrency:
      # One spec run per intent at a time; never cancel a run mid-generation.
      group: spec-from-intent-${{ matrix.slug }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate spec.md
        env:
          # Or the Bedrock / Vertex / Foundry equivalents — see lesson 12.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          dir="intent/$SLUG"
          intent="$dir/intent.md"
          test -f "$intent" || { echo "::error::$intent does not exist"; exit 1; }

          # The standard lesson-3 prompt (first paragraph, verbatim) plus a repo-local
          # structure requirement. Stage 2 is reviewed by two people with different
          # questions: the product owner asks whether this solves the problem, the tech
          # lead asks whether the design holds. One undifferentiated document serves
          # neither, so the prompt makes the split an explicit property of the artifact.
          claude -p "Read $intent and produce a requirements and design spec for \
          integrating it into our existing codebase. Apply the skills available to you so \
          the plan conforms to our brand guidelines, security policies and UX standards. \
          Document the spec fully as $dir/spec.md, ready to hand to the engineering team. \
          Describe clearly any areas of concern, especially where you cannot satisfy \
          contradicting policies. \
          Two different people review this spec, so structure it in two clearly labelled \
          parts and open the file with a short 'Review guide' stating who reads what. \
          '## Part A - Product' comes first and must be reviewable by a product owner with \
          no engineering background: summary, scope (in scope, out of scope, deferred), the \
          decisions that close the open questions the intent left, any decision you added \
          that the product owner should confirm or cut, the functional requirements stated \
          as observable behaviour, and the risks. Keep file paths, library and package \
          names, code, schemas and rendering or API mechanics out of Part A entirely - where \
          a technical choice has a product consequence, state only the consequence and \
          cross-reference Part B. \
          '## Part B - Technical design' follows and carries everything the engineering team \
          needs to plan the build: how this fits the existing app, non-functional \
          requirements, the design itself, security, and verification. Assume its reader \
          has already read Part A and do not repeat it. \
          Number the sections continuously across both parts so cross-references resolve. \
          End the file with a '## Areas of concern' section, outside both parts; if there \
          are none, write 'None.' there. Write each concern so a product owner can act on \
          it without reading Part B, and keep it short - the reasoning already lives in \
          the section you cross-reference, so do not restate it here. Use exactly this \
          shape per concern, one sentence per line, plain words, no hedging: \
          a bold heading line '**C-n - <the concern in under 15 words>** (§refs)', then \
          three bullets: '- **Conflict:** <what clashes, one sentence>', \
          '- **Chosen:** <which way this spec went, one sentence>', \
          '- **Decide:** <the one question the product owner must answer>'. \
          Only list items that need a product owner decision; a risk they merely need to \
          know about belongs in Part A's risks, not here." \
            --model claude-sonnet-5 \
            --max-turns 60 \
            --allowed-tools 'Read,Grep,Glob,Skill,Write' \
            --permission-mode acceptEdits \
            > "$RUNNER_TEMP/session.log" 2>&1 || {
              echo "::error::spec generation failed for $intent"; cat "$RUNNER_TEMP/session.log"; exit 1; }

          test -s "$dir/spec.md" || { echo "::error::no spec.md written for $intent"; exit 1; }

          # Provenance: the spec, the prompt, and the skill versions that produced it
          # all belong in version control (lesson 3, governance).
          {
            echo "intent: $intent"
            echo "generated_at: $(date -u +%FT%TZ)"
            echo "model: claude-sonnet-5"
            echo "workflow_run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "repo_sha: ${{ github.sha }}"
            echo "skills_sha: $(git log -1 --format=%H -- .claude/skills || echo none)"
          } > "$dir/spec.provenance.yml"

          # The merge approved it; make the artifact say so.
          sed -i -E 's/^(\s*-?\s*\*\*Status:\*\*).*/\1 approved/i' "$intent"

      - name: Open PR for product owner review
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          branch="spec/$SLUG-${{ github.run_id }}"
          git config user.name  'claude-spec-bot'
          git config user.email 'claude-spec-bot@users.noreply.github.com'
          git checkout -b "$branch"
          git add "intent/$SLUG"
          git commit -F - <<COMMIT
          spec: $SLUG

          Generated from intent/$SLUG/intent.md by spec-from-intent.
          COMMIT
          git push -u origin "$branch"

          # Surface flagged concerns in the PR body so the product owner sees them first.
          sed -n '/^## Areas of concern/,$p' "intent/$SLUG/spec.md" > concerns.md || true

          cat > pr-body.md <<HEAD
          Generated by \`spec-from-intent\` (Stage 2 — [lesson 3](https://academy.claude.com/courses/ai-native-sdlc-playbook/requirements-and-design)) from \`intent/$SLUG/intent.md\`.

          **Product owner, before approving:** does this spec solve the problem the intent
          describes, and does it close the intent's open questions? Read **Part A -
          Product** and the concerns below; **Part B - Technical design** is the tech
          lead's review, not yours.

          HEAD
          cat concerns.md >> pr-body.md
          cat >> pr-body.md <<'TAIL'

          Merging this PR is the Stage 2 gate. Take any concern above to the relevant
          policy owner *before* engineering picks this up.
          TAIL

          url="$(gh pr create --title "spec: $SLUG" --body-file pr-body.md \
            --label spec --label needs-po-review)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
          if grep -qviE '^(## Areas of concern|None\.?|\s*)$' concerns.md; then
            gh pr edit --add-label needs-policy-owner
            echo "concerns=1" >> "$GITHUB_OUTPUT"
          fi

      # A spec PR sits waiting on one named person, and nothing else in this pipeline
      # tells them it exists. plan-ready already announces gate 2 clearing; this
      # announces gate 2 opening, so the channel sees both ends of the review.
      - name: Notify the team channel
        if: steps.pr.outputs.url != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          URL: ${{ steps.pr.outputs.url }}
          CONCERNS: ${{ steps.pr.outputs.concerns }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::notice::SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi
          if [ -n "${CONCERNS:-}" ]; then
            text="⚠ Spec ready for product owner review — concerns flagged: $URL"
          else
            text="Spec ready for product owner review: $URL"
          fi
          payload="$(jq -nc --arg t "$text" '{text:$t}')"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
