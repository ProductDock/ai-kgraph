# Runs the app's own checks — lint, typecheck, test, build — on every push to main and
# every PR that touches code. Additive: does not touch spec-from-intent.yml or
# plan-ready.yml.
#
# Pins actions by commit SHA, unlike the existing workflows' mutable @v4 tags (spec §8.8,
# C-9) — new workflows added here take a stricter posture deliberately.

name: verify

on:
  push:
    branches: [main]
  pull_request:
    # Documents-only PRs have no code to lint, typecheck, test or build. The main
    # source of these is the spec PR that spec-from-intent.yml opens, which touches
    # only intent/<slug>/*. The workflow runs when *any* changed file matches the
    # list below, so a PR mixing a spec and real code still runs the full suite.
    #
    # `content/**` is re-included last, and the order is what makes it work: a later
    # positive pattern overrides an earlier `!`. Topic pages are markdown, but the
    # build validates them against seed.ts, so a content-only PR is exactly the one
    # that must run it - under a plain `**.md` ignore, a page for a renamed topic
    # would pass review unchecked and fail the build on main.
    #
    # A skipped workflow reports no check at all, so verify must not become a
    # required status check on main without a companion no-op job to report for it.
    paths:
      - '**'
      - '!intent/**'
      - '!docs/**'
      - '!**.md'
      - 'content/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Not a secret - inlined at build time, same placeholder as .env.example.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: npm audit --audit-level=high
        continue-on-error: true
